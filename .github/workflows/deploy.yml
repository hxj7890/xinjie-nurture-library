name: Deploy nurture library
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xinjie-production
  # A stale SSH session must never keep a newer production fix queued.
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt && python -m py_compile app/main.py
      - run: docker build -t xinjie/nurture-library:ci .
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # Production rebuilds may need to fetch Python wheels on a cold cache.
    # Leave enough room for that work instead of cancelling a healthy deploy.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Create immutable release package
        run: |
          rm -rf .release vendor/wheels
          mkdir -p vendor/wheels
          python3 -m pip download --disable-pip-version-check --dest vendor/wheels -r requirements.txt
          mkdir .release
          git archive "$GITHUB_SHA" | tar -x -C .release
          cp -R vendor .release/vendor
          tar --format=pax -cf "nurture-library-${GITHUB_SHA}.tar" -C .release .
          gzip -f "nurture-library-${GITHUB_SHA}.tar"
      - name: Configure deployment SSH key
        env: {DEPLOY_PRIVATE_KEY: '${{ secrets.DEPLOY_PRIVATE_KEY }}', DEPLOY_KNOWN_HOSTS: '${{ secrets.DEPLOY_KNOWN_HOSTS }}'}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          # Public key only: use this to prove the authorized_keys entry matches
          # the GitHub Actions deployment secret if SSH authentication fails.
          ssh-keygen -y -f ~/.ssh/id_ed25519
      - name: Build runtime configuration
        env:
          DEPLOY_HOST: '${{ secrets.DEPLOY_HOST }}'
          SPARK_API_KEY: '${{ secrets.NURTURE_SPARK_API_KEY }}'
          DINGTALK_APP_KEY: '${{ secrets.NURTURE_DINGTALK_APP_KEY }}'
          DINGTALK_APP_SECRET: '${{ secrets.NURTURE_DINGTALK_APP_SECRET }}'
          XINJIE_QUALITY_AGENT_TOKEN: '${{ secrets.XINJIE_QUALITY_AGENT_TOKEN }}'
        run: |
          test -n "$SPARK_API_KEY"
          test -n "$DINGTALK_APP_KEY"
          test -n "$DINGTALK_APP_SECRET"
          test -n "$XINJIE_QUALITY_AGENT_TOKEN"
          umask 077
          {
            printf '%s\n' 'OPENAI_BASE_URL=https://aixinghuo.net/v1'
            printf '%s\n' 'OPENAI_MODEL=gpt-5.5'
            printf '%s\n' 'OPENAI_VISION_BASE_URL=https://aixinghuo.net/v1'
            printf '%s\n' 'OPENAI_VISION_MODEL=gpt-5.5'
            printf 'OPENAI_API_KEY=%s\n' "$SPARK_API_KEY"
            printf 'OPENAI_VISION_API_KEY=%s\n' "$SPARK_API_KEY"
            printf 'DINGTALK_NURTURE_APP_KEY=%s\n' "$DINGTALK_APP_KEY"
            printf 'DINGTALK_NURTURE_APP_SECRET=%s\n' "$DINGTALK_APP_SECRET"
            printf 'XINJIE_QUALITY_AGENT_TOKEN=%s\n' "$XINJIE_QUALITY_AGENT_TOKEN"
            printf '%s\n' 'XINJIE_QUALITY_GATE_REQUIRED=1'
            printf '%s\n' 'XINJIE_QUALITY_GATE_URL=https://hub.xinjieai.com/api/agent/v1'
            printf '%s\n' 'NURTURE_PUBLIC_URL=https://nurture.xinjieai.com'
          } > nurture-library.env
      - name: Inspect deployment host
        env: {DEPLOY_HOST: '${{ secrets.DEPLOY_HOST }}'}
        run: |
          ssh_options=(-o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          timeout 60 ssh "${ssh_options[@]}" -i ~/.ssh/id_ed25519 "ubuntu@${DEPLOY_HOST}" "sudo ps -eo pid,etime,cmd | grep -E '[x]injie-extra-deploy|[d]ocker compose' || true; sudo docker ps --format '{{.Names}} {{.Status}}' | grep -E 'nurture|dingtalk' || true"
      - name: Upload release files
        env: {DEPLOY_HOST: '${{ secrets.DEPLOY_HOST }}'}
        run: |
          ssh_options=(-o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          # The wheelhouse is intentionally larger than a source-only release.
          # Allow the slow production uplink to finish without removing the
          # bounded failure behavior.
          timeout 900 scp -O "${ssh_options[@]}" -i ~/.ssh/id_ed25519 "nurture-library-${GITHUB_SHA}.tar.gz" nurture-library.env "ubuntu@${DEPLOY_HOST}:incoming/"
      - name: Stage release files
        env: {DEPLOY_HOST: '${{ secrets.DEPLOY_HOST }}'}
        run: |
          ssh_options=(-o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          timeout 60 ssh "${ssh_options[@]}" -i ~/.ssh/id_ed25519 "ubuntu@${DEPLOY_HOST}" "sudo install -d -m 755 /var/lib/xinjie-deploy/incoming && sudo install -m 600 /home/ubuntu/incoming/nurture-library-${GITHUB_SHA}.tar.gz /var/lib/xinjie-deploy/incoming/nurture-library-${GITHUB_SHA}.tar.gz && sudo install -m 600 /home/ubuntu/incoming/nurture-library.env /var/lib/xinjie-deploy/incoming/nurture-library.env"
      - name: Build production release
        env: {DEPLOY_HOST: '${{ secrets.DEPLOY_HOST }}'}
        run: |
          ssh_options=(-o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          timeout 360 ssh "${ssh_options[@]}" -i ~/.ssh/id_ed25519 "ubuntu@${DEPLOY_HOST}" "sudo /usr/local/sbin/xinjie-extra-deploy nurture-library ${GITHUB_SHA}"
      - name: Restart production services
        env: {DEPLOY_HOST: '${{ secrets.DEPLOY_HOST }}'}
        run: |
          ssh_options=(-o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          timeout 180 ssh "${ssh_options[@]}" -i ~/.ssh/id_ed25519 "ubuntu@${DEPLOY_HOST}" "sudo docker compose --env-file /opt/xinjie/infra/release.env -f /opt/xinjie/infra/docker-compose.yml -f /opt/xinjie/infra/docker-compose.extra.yml up -d --force-recreate --no-deps nurture-library nurture-dingtalk"
      - name: Verify production health
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS https://nurture.xinjieai.com/api/health; then
              exit 0
            fi
            sleep 5
          done
          echo "nurture service did not become healthy within two minutes" >&2
          exit 1
