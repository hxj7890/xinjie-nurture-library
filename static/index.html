<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>养号素材库</title><link rel="stylesheet" href="/style.css"><main><header><p>XI NJIE / NURTURE</p><h1>养号素材库</h1><span>把日常存下来，按自己的节奏慢慢发布。</span></header><section class="settings"><h2>发布节奏</h2><label>每 <input id="days" type="number" min="1" max="30" value="2"> 天发布一篇</label><label>首篇发布时间 <input id="start" type="datetime-local"></label><label>平台 <input id="platform" placeholder="例如 douyin"></label><label>账号 <input id="account" placeholder="蚁小二账号标识"></label><button id="save">保存节奏</button><small>未设置平台和账号时，素材只入库不会推送。</small></section><section class="intake"><h2>收进今天的日常</h2><p>同一次选择的多张图片会自动归为一篇多图内容。</p><input id="files" type="file" accept="image/*" multiple><textarea id="note" placeholder="可选：补充一点当时的心情或背景，AI 不会虚构未提供的细节。"></textarea><button id="import">生成文案并入库</button><span id="message"></span></section><section><h2>发布队列</h2><div id="list"></div></section></main><script src="/app.js"></script></html>
