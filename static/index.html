<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>养号素材库 · 新界作战指挥系统</title><link rel="stylesheet" href="/style.css?v=20260814-no-overlap"><main><header><p>XINJIE COMMAND / NURTURE LIBRARY</p><h1>养号素材库</h1><span>内容、账号、音乐与排期，都在这里直接发布。</span></header>
<section class="intake"><h2>收进今天的日常</h2><p>同一次选择的多张图片会自动归为一篇多图内容。</p><input id="files" type="file" accept="image/*" multiple><textarea id="note" placeholder="可选：补充一点当时的心情或背景，AI 不会虚构未提供的细节。"></textarea><button id="import">生成文案并入库</button><span id="message"></span></section>
<section class="queue"><div class="queue-head"><div><h2>发布队列</h2><p>选择素材后，可一次配置账号、随机音乐和定时规则。</p></div><div id="summary" class="summary"></div></div>
<div class="toolbar"><label class="check"><input id="selectAll" type="checkbox"> 全选</label><select id="bulkAccount"><option value="">批量选择账号</option></select><label>起始 <input id="bulkTime" type="datetime-local"></label><label>间隔 <input id="bulkInterval" type="number" min="0" max="1440" value="30"> 分钟</label><label class="check"><input id="bulkMusic" type="checkbox" checked> 随机音乐</label><button id="bulkConfig" class="secondary">批量定时</button><button id="batchPublish">批量发布</button></div>
<div id="filters" class="filters"></div><div id="list"></div></section></main><script src="/app.js?v=20260814-direct-publish"></script></html>
